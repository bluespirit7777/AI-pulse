name: Update AI Market Pulse data

on:
  schedule:
    # Twice hourly at :07 and :37 — off the congested :00/:30 slots so runs
    # start more reliably. Treat as "near-live", not to-the-second.
    - cron: '7,37 * * * *'
  workflow_dispatch: {}

permissions:
  contents: write
  discussions: read   # Community Pulse's GitHub Discussions source (reads PUBLIC discussions on other labs' repos — this scope only governs this repo's own, harmless to declare)

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch latest data
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}   # Community Pulse's GitHub Discussions source (GraphQL needs auth even for public repos); absent locally is a graceful per-model skip, never an error
        run: node scripts/update-data.mjs

      - name: Validate data + run unit tests
        run: npm run validate && npm test

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "No data changes."
            exit 0
          fi
          git commit -m "chore: refresh data snapshot [skip ci]"
          # This runs every 30 min and can race another writer landing on main
          # between checkout and push. Retry a non-fast-forward rejection by
          # fetching and rebasing this generated-data commit onto the new tip.
          # Stage all of data/ so every generated artifact is included. If the
          # rebase conflicts, fail closed rather than recommitting a stale
          # index that could include or revert unrelated remote changes.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push rejected (attempt $i) — remote moved, rebasing and retrying..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort 2>/dev/null || true
              echo "::error::Rebase conflict; refusing to retry on a stale checkout."
              exit 1
            fi
            npm run validate
            npm test
            sleep $((RANDOM % 5 + 1))
          done
          echo "::error::Failed to push data snapshot after 5 attempts."
          exit 1
